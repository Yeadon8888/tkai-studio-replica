<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio 确认台</title><style>
:root{--ink:#17201d;--muted:#68756f;--paper:#f4f5f1;--card:#fff;--line:#dce1dc;--green:#176b52;--green2:#e3f1ea;--amber:#a66312;--red:#b43b30}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:22px clamp(16px,4vw,48px);background:#102b23;color:#fff;display:flex;justify-content:space-between;align-items:end}h1{margin:0;font-size:24px}header p{margin:3px 0 0;color:#bad0c7}.wrap{max-width:1280px;margin:auto;padding:24px}.stats,.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.item,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stats b{display:block;font-size:22px}.muted{color:var(--muted);font-size:13px}.item{display:flex;gap:12px;align-items:center;margin:10px 0;cursor:pointer}.item:hover{border-color:var(--green)}.item .grow{flex:1}.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--green2);color:var(--green);font-size:12px}button{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--green);color:#fff;cursor:pointer}button.alt{background:#e9ece9;color:var(--ink)}button.bad{background:var(--red)}button.warn{background:var(--amber)}input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:block;margin:10px 0}.drawer{position:fixed;inset:0;background:#0006;display:none;z-index:4}.drawer.open{display:block}.sheet{margin-left:auto;width:min(880px,100%);height:100%;overflow:auto;background:var(--paper);padding:24px}.sheet-head{display:flex;justify-content:space-between;gap:12px}.sheet-head button{align-self:start}.panel{margin:12px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.videos video{width:100%;max-height:520px;background:#000}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.errors{color:var(--red);white-space:pre-wrap}.segment textarea{min-height:84px}.issue{display:flex;gap:8px;align-items:start;border-top:1px solid var(--line);padding:8px 0}.issue button{padding:3px 7px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.wrap{padding:14px}.sheet{padding:16px}}
</style></head><body><header><div><h1>Studio 确认台</h1><p>待办、预算与人工闸门</p></div><button class="alt" onclick="load()">刷新</button></header><main class="wrap"><section id="stats" class="stats"></section><h2>各品阶段</h2><section id="products" class="products"></section><h2>待确认</h2><p class="muted">优先显示会阻塞后续付费步骤的节点。</p><section id="pending"></section></main><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="sheet"><div class="sheet-head"><div><span id="kind" class="tag"></span><h2 id="title"></h2></div><button class="alt" onclick="closeDrawer()">关闭</button></div><div id="detail"></div><div id="errors" class="errors"></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw j;return j}
async function load(){const status=await api('/api/status');const [pending,stats]=await Promise.all([api('/api/pending'),api('/api/statistics')]);$('#stats').innerHTML=`<div class="card">待确认<b>${pending.length}</b></div><div class="card">专家与人工一致率<b>${stats.calibration.rate==null?'样本不足':Math.round(stats.calibration.rate*100)+'%'}</b><span class="muted">${stats.calibration.agree}/${stats.calibration.total}</span></div><div class="card">每元产出<b>${stats.usable_per_cny==null?'暂无':stats.usable_per_cny}</b><span class="muted">${stats.usable} 条可用 / ${stats.spent_cny} 元</span></div>`;$('#products').innerHTML=status.map(x=>`<div class="card"><span class="tag">${esc(x.stage_label)}</span><h3>${esc(x.product)}</h3><div class="muted">运行 ${esc(x.run||'未建立')}</div><div>已花 ${x.budget?.spent_cny??'—'} / 上限 ${x.budget?.limit_cny??'—'} 元</div></div>`).join('')||'<p class="muted">暂无产品。</p>';$('#pending').innerHTML=pending.map(x=>`<article class="item" onclick="openCp('${esc(x.id)}')"><span class="tag">${esc(x.kind)}</span><div class="grow"><b>${esc(x.summary)}</b><div class="muted">${esc(x.product)} · ${esc(x.run)}</div></div><span>${['benchmark','script','budget'].includes(x.kind)?'阻塞付费':'待处理'} →</span></article>`).join('')||'<p class="panel">暂无待确认节点。</p>'}
function closeDrawer(){$('#drawer').classList.remove('open');current=null}
async function openCp(id){current=await api('/api/checkpoint/'+encodeURIComponent(id));$('#kind').textContent=current.kind;const d=current.detail||{};$('#title').textContent=current.summary+(current.kind==='verdict'?` · ${d.duration??'未知'} 秒 · ${d.cost_cny??'未知'} 元`:'');$('#errors').textContent='';$('#detail').innerHTML=render(current);$('#drawer').classList.add('open')}
const field=(name,label,type='text')=>`<label>${label}${type==='textarea'?`<textarea id="${name}"></textarea>`:`<input id="${name}" type="${type}">`}</label>`;
function common(){return `${field('by','决定人')} ${field('note','说明（返修或放弃必填）','textarea')}`}
function referenceView(d){if(d.reference_video)return `<video aria-label="对标播放器" controls src="${esc(d.reference_video)}"></video><p class="muted">来源：${d.reference_source==='local'?'本地副本':'可访问的远程地址'}</p>`;const cover=d.reference_cover?`<img src="${esc(d.reference_cover)}" alt="对标封面" style="width:100%;max-height:520px;object-fit:contain;background:#000">`:'<div class="panel muted">没有可用的对标封面</div>';return `${cover}<p class="errors">播放地址已过期</p><div class="actions">${d.reference_original?`<a href="${esc(d.reference_original)}" target="_blank"><button type="button">原链接</button></a>`:''}<button type="button" class="alt" disabled title="${esc(d.reference_refresh_hint)}">用 covers.py --refresh 刷新封面</button></div>`}
function essencePanel(d){const e=d.essence||{};if(!(e.items||[]).length)return '';return `<div class="panel"><b>神韵还原度：${((e.essence_score||0)*100).toFixed(1)}%</b>${e.items.map(i=>`<label>${esc(i.id)} · ${esc(i.what)}<select class="essence-status" data-id="${esc(i.id)}"><option value="${esc(i.status)}">当前：${esc(i.status)}</option><option value="pass">pass</option><option value="fail">fail</option><option value="unclear">unclear</option></select><span class="muted">${esc(i.at)} ${esc(i.detail)}</span></label>`).join('')}<label>神韵是否达到 80%<select id="essence_reached"><option value="">请选择</option><option value="yes">是</option><option value="no">否</option></select></label></div>`}
function render(x){const d=x.detail||{};let body='';if(x.kind==='benchmark')body=(d.benchmarks||[]).map(b=>`<div class="panel"><div class="grid2"><div>${b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.id||'对标')} 封面" style="width:100%;max-height:280px;object-fit:cover;border-radius:9px">`:'<div class="muted">没有登记封面</div>'}</div><div><b>${esc(b.id||'对标')}</b><div><a href="${esc(b.url||'#')}" target="_blank">打开链接</a></div><div>播放 ${esc(b.plays??'未登记')} · 档位 ${esc(b.tier||'待确认')}</div><p>${esc(b.tier_reason||'未登记档位理由')}</p></div></div></div>`).join('')+field('choice','选择的对标')+field('tier','确认档位')+common()+buttons([['approved','确认对标',''],['changes_requested','要求调整','warn'],['rejected','驳回','bad']]);else if(x.kind==='script')body=(d.segments||[]).map(s=>`<div class="panel segment" data-seg="${s.segment}"><b>第 ${s.segment} 段 · ${esc(s.duration)} 秒 · 口播 ${s.voiceover_words}/${esc(s.voiceover_word_limit||'未设')} 词</b>${edit('visual_prompt','画面提示词',s.visual_prompt)}${edit('voiceover','口播',s.voiceover)}${edit('caption','字幕',s.caption)}${edit('onscreen_copy','画面文字',s.onscreen_copy)}</div>`).join('')+common()+`<div class="actions"><button onclick="saveScript()">保存修改并重新校验</button><button class="alt" onclick="resolveCp('approved')">直接批准</button></div>`;else if(x.kind==='budget')body=`<div class="panel">品预算：已花 ${d.budget?.spent_cny} / 上限 ${d.budget?.limit_cny} 元，剩余 ${d.budget?.remaining_cny} 元</div>`+(d.units||[]).map(u=>`<div class="panel"><b>${esc(u.id)}</b><div>${esc(u.model)} · ${esc(u.duration)} 秒 · 单价 ${u.unit_price_cny??'未知'} 元/秒 · 合计 ${u.estimate_cny??'未知'} 元</div><p class="muted">${esc(u.reason)}</p></div>`).join('')+common()+buttons([['approved','批准预算',''],['changes_requested','缩减计划','warn'],['rejected','驳回','bad']]);else if(x.kind==='verdict')body=`<div class="grid2 videos"><div><b>成片</b><video id="takeVideo" aria-label="成片播放器" controls src="${esc(d.video)}"></video></div><div><b>对标</b>${referenceView(d)}</div></div><div class="panel"><b>闸门判定：${esc(d.decision?.decision)}</b><div class="muted">最新评审时间：${esc(d.reviewed_at||'未记录')}</div><p>${esc(d.decision?.reason||'')}</p>${(d.uncited_low_text||[]).length?'<div class="errors">存在无证据低分：<ul>'+d.uncited_low_text.map(v=>`<li>${esc(v)}</li>`).join('')+'</ul></div>':''}</div>${essencePanel(d)}<div class="panel"><b>专家问题</b>${(d.issues||[]).map(i=>`<div class="issue"><button class="alt" onclick="jump('${esc(i.at)}')">${esc(i.at||'—')}</button><span>${esc(i.expert)}：${esc(i.detail)}</span></div>`).join('')||'<p class="muted">没有记录问题。</p>'}</div><div class="panel"><b>评审历史</b>${(d.review_history||[]).map((r,i)=>`<div>${i===0?'最新':'历史'} · ${esc(r.reviewed_at)} · ${esc(r.decision||'未判定')} <span class="muted">${esc(r.review_id)}</span></div>`).join('')||'<p class="muted">没有评审历史。</p>'}</div>`+common()+buttons([['approved','可用',''],['changes_requested','返修','warn'],['rejected','放弃','bad']]);else if(x.kind==='publish')body=field('published','是否发布')+field('account','账号')+field('url','发布链接','url')+common()+buttons([['approved','确认记录',''],['rejected','暂不发布','bad']]);else body=`<pre>${esc(JSON.stringify(x.subject,null,2))}</pre>`+common()+buttons([['approved','批准',''],['changes_requested','要求修改','warn'],['rejected','驳回','bad']]);return body}
function edit(f,l,v){return `<label>${l}<textarea data-field="${f}">${esc(v)}</textarea></label>`}function buttons(rows){return `<div class="actions">${rows.map(([s,l,c])=>`<button class="${c}" onclick="resolveCp('${s}')">${l}</button>`).join('')}</div>`}
function values(){const get=id=>document.getElementById(id)?.value||'';const fields={choice:get('choice'),tier:get('tier'),published:get('published'),account:get('account'),url:get('url')};if(current?.kind==='verdict'){fields.review_id=(current.detail?.review_history||[])[0]?.review_id||'';fields.essence_reached=get('essence_reached');fields.essence_overrides=[...document.querySelectorAll('.essence-status')].map(x=>({id:x.dataset.id,status:x.value}));fields.reviewer=get('by')||'确认台'}return {by:get('by')||'确认台',note:get('note'),fields}}
async function resolveCp(status){try{const v=values();await api(`/api/checkpoint/${encodeURIComponent(current.id)}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,...v})});closeDrawer();load()}catch(e){$('#errors').textContent=(e.errors||[e.error]).join('\n')}}
async function saveScript(){const v=values(),edits=[];document.querySelectorAll('.segment').forEach(p=>p.querySelectorAll('textarea[data-field]').forEach(t=>edits.push({segment:Number(p.dataset.seg),field:t.dataset.field,value:t.value})));try{await api(`/api/checkpoint/${encodeURIComponent(current.id)}/edit-script`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits,by:v.by,note:v.note})});closeDrawer();load()}catch(e){$('#errors').textContent=(e.errors||[e.error]).join('\n')}}
function jump(at){const m=String(at).match(/(\d+):([0-5]?\d)(?:\.(\d+))?/);if(!m)return;const v=$('#takeVideo');v.currentTime=Number(m[1])*60+Number(m[2])+Number('0.'+(m[3]||0));v.play()}
load().catch(e=>$('#pending').innerHTML=`<p class="errors">${esc(e.error||e)}</p>`);
</script></body></html>
