    images_max: 0
    audio_max: 0
    first_last: true
    ref_video: false
    seed: {min: 1, max: 999999999999999}
    prices: {per_second: {480p: 0.10, 768p: 0.13}}
    policy: allowed
    verified: {date: '2026-11-03', basis: TokensFactory 公开接口文档}
    notes: first_frame、last_frame 和 prompt 必填；不能传通用 images。
  - id: minimax_h3_zm_titi
    provider: tokensfactory
    kind: video
    durations: {min: 5, max: 25}
