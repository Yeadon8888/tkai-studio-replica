  # TTS
  - id: gemini-3.8-flash-tts
    provider: tokensfactory
    kind: tts
    prices: {input_per_million_tokens: 1.60, output_per_million_tokens: 28.00}
    policy: allowed
    verified: {date: '2026-11-03', basis: Kore/Puck 短句实测为 24kHz 单声道 WAV}
    notes: 使用原生 generateContent 接口；不走 /v1/audio/speech。

  # MiniMax H3：允许自动选择
  - id: minimax-H3
    provider: tokensfactory
    kind: video
    durations: [10, 15]
    resolutions: [768p]
    aspects: ['9:16', '16:9']
    images_min: 1
    images_max: 9
    audio_max: 3
    first_last: false
    ref_video: false
    seed: {min: 0, max: 2147483647}
    prices: {per_second: {768p: 0.13}}
    policy: allowed
    verified: {date: '2026-11-03', basis: TokensFactory 公开接口文档}
    notes: 固定 768p，不接参考视频。
  - id: minimax-H3-fast
    provider: tokensfactory
    kind: video
    durations: {min: 1, max: 15}
    resolutions: [480p, 768p]
    aspects: ['9:16', '16:9']
