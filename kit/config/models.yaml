    images_max: 9
    audio_max: 3
    first_last: false
    ref_video: false
    seed: {min: 0, max: 2147483647}
    prices: {per_second: {480p: 0.10, 768p: 0.13, 960p: 0.23}}
    policy: allowed
    verified: {date: '2026-11-03', basis: TokensFactory 公开接口文档}
    notes: H3 系列中唯一已核验支持 960p 的路线。
  - id: minimax-H3-first-last
    provider: tokensfactory
    kind: video
    durations: {min: 1, max: 15}
    resolutions: [480p, 768p]
    aspects: ['9:16', '16:9', '1:1']
