    images_max: 9
    audio_max: 3
    first_last: false
    ref_video: false
    seed: {min: 0, max: 2147483647}
    prices: {per_second: {480p: 0.10, 768p: 0.13}}
    policy: allowed
    verified: {date: '2026-11-03', basis: TokensFactory 公开接口文档}
    notes: 不支持 960p 或参考视频。
  - id: minimax-H3-cinema
